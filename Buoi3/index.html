<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
      }
      .search_bar,
      .category_search {
        width: 550px;
        height: 45px;
        font-size: x-large;
        margin: 20px;
      }
      .container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin: 20px;
      }
      .product_item {
        background-color: #fff;
        border: 1px solid #ddd;
        border-radius: 5px;
        padding: 15px;
        width: 300px;
        text-align: center;
      }
      .product_item img {
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <input type="text" class="search_bar" placeholder="Tìm kiếm..." />
    <input
      type="text"
      class="category_search"
      placeholder="Tìm kiếm theo loại..."
    />
    <script src="script.js"></script>
  </body>
</html>
